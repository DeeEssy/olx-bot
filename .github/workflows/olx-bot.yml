name: OLX bot poll

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: olx-bot-poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Run one poll cycle
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
          CITY_SLUG: ${{ vars.CITY_SLUG }}
          CITY_NAME: ${{ vars.CITY_NAME }}
          PRICE_MIN: ${{ vars.PRICE_MIN }}
          PRICE_MAX: ${{ vars.PRICE_MAX }}
          ROOMS: ${{ vars.ROOMS }}
          PETS_ONLY: ${{ vars.PETS_ONLY }}
          OWNER_TYPE: ${{ vars.OWNER_TYPE }}
          PAGES_TO_SCAN: ${{ vars.PAGES_TO_SCAN }}
          MAX_AGE_DAYS: ${{ vars.MAX_AGE_DAYS }}
          TELEGRAM_CHAT_ID_SALE: ${{ vars.TELEGRAM_CHAT_ID_SALE }}
          SALE_PRICE_MIN: ${{ vars.SALE_PRICE_MIN }}
          SALE_PRICE_MAX: ${{ vars.SALE_PRICE_MAX }}
          SALE_ROOMS: ${{ vars.SALE_ROOMS }}
          SALE_OWNER_TYPE: ${{ vars.SALE_OWNER_TYPE }}
          SALE_MAX_AGE_DAYS: ${{ vars.SALE_MAX_AGE_DAYS }}
          DB_PATH: data/state.db
        run: python run_once.py

      - name: Persist dedup state
        run: |
          if [ -n "$(git status --porcelain data/state.db)" ]; then
            git config user.name "olx-bot"
            git config user.email "olx-bot@users.noreply.github.com"
            git add data/state.db
            git commit -m "Update sent-ads state"
            git push
          else
            echo "No state changes"
          fi
